<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="physGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="sophosGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="clusterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="distGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2e1065" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Markers for arrows -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="900" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 H 1100 M 0,200 H 1100 M 0,300 H 1100 M 0,400 H 1100 M 0,500 H 1100 M 0,600 H 1100 M 0,700 H 1100 M 0,800 H 1100"/>
    <path d="M 100,0 V 900 M 200,0 V 900 M 300,0 V 900 M 400,0 V 900 M 500,0 V 900 M 600,0 V 900 M 700,0 V 900 M 800,0 V 900 M 900,0 V 900 M 1000,0 V 900"/>
  </g>

  <!-- ==================== 1. PHYSICAL INFRASTRUCTURE ==================== -->
  <g transform="translate(150, 30)">
    <rect width="800" height="85" rx="10" fill="url(#physGrad)" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="800" height="26" rx="10" fill="#0f172a" opacity="0.6"/>
    
    <text x="20" y="18" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">PHYSICAL HARDWARE LAYER (BARE-METAL)</text>
    
    <circle cx="35" cy="55" r="14" fill="#0284c7" opacity="0.2"/>
    <text x="35" y="60" text-anchor="middle" font-size="16">🖥️</text>
    
    <text x="60" y="50" fill="#f8fafc" font-size="15" font-weight="700">Dell PowerEdge R740 Enterprise Server</text>
    <text x="60" y="68" fill="#38bdf8" font-size="12" font-family="monospace">Host IP: 10.100.14.17</text>
    
    <g transform="translate(420, 38)">
      <rect width="360" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="21" fill="#cbd5e1" font-size="12">
        <tspan fill="#38bdf8" font-weight="bold">74 GB</tspan> RAM  |  
        <tspan fill="#34d399" font-weight="bold">3 TB</tspan> Storage  |  
        <tspan fill="#f59e0b" font-weight="bold">VMware Workstation Pro</tspan>
      </text>
    </g>
  </g>

  <!-- Connection: Physical to Firewall -->
  <path d="M 550, 115 V 155" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrowCyan)"/>
  <rect x="500" y="125" width="100" height="18" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="550" y="138" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">NAT / WAN UPLINK</text>

  <!-- ==================== 2. SOPHOS XG FIREWALL ==================== -->
  <g transform="translate(200, 160)">
    <rect width="700" height="110" rx="10" fill="url(#sophosGrad)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="700" height="26" rx="10" fill="#0f172a" opacity="0.7"/>
    
    <text x="20" y="18" fill="#c7d2fe" font-size="11" font-weight="700" letter-spacing="1">PERIMETER SECURITY, CORE ROUTING &amp; NAT (VM on Host 11.0.0.8)</text>
    
    <circle cx="40" cy="65" r="18" fill="#4338ca" opacity="0.3"/>
    <text x="40" y="72" text-anchor="middle" font-size="20">🛡️</text>
    
    <text x="70" y="55" fill="#ffffff" font-size="16" font-weight="700">Sophos XG Next-Gen Firewall Appliance</text>
    <text x="70" y="74" fill="#a5b4fc" font-size="11">Core Routing • Inter-Subnet Firewall Rules • Application Inspection • Outbound NAT</text>
    <text x="70" y="92" fill="#38bdf8" font-size="11" font-family="monospace">Web Admin Console: https://11.0.0.15:4444</text>
    
    <!-- Sophos Interfaces Badges -->
    <g transform="translate(480, 36)">
      <rect width="205" height="20" rx="4" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="14" fill="#38bdf8" font-size="10" font-family="monospace" font-weight="bold">Port 2 (WAN): 11.0.1.128/24</text>

      <rect y="24" width="205" height="20" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
      <text x="10" y="38" fill="#34d399" font-size="10" font-family="monospace" font-weight="bold">Port 1 (LAN): 11.0.0.15/24</text>

      <rect y="48" width="205" height="20" rx="4" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
      <text x="10" y="62" fill="#a78bfa" font-size="10" font-family="monospace" font-weight="bold">Port 3 (LAN): 12.0.0.2/24</text>
    </g>
  </g>

  <!-- Connectors from Sophos to Subnets -->
  <!-- Line to Subnet 11 -->
  <path d="M 370, 270 V 330" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <rect x="290" y="285" width="160" height="22" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="370" y="300" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">Port 1 (LAN) ➔ 11.0.0.15</text>

  <!-- Line to Subnet 12 -->
  <path d="M 830, 270 V 330" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
  <rect x="750" y="285" width="160" height="22" rx="4" fill="#4c1d95" stroke="#a78bfa" stroke-width="1"/>
  <text x="830" y="300" fill="#a78bfa" font-size="11" font-weight="bold" text-anchor="middle">Port 3 (LAN) ➔ 12.0.0.2</text>

  <!-- ==================== 3. SUBNET 11.0.0.0/24 (HA CLUSTER) ==================== -->
  <g transform="translate(40, 335)">
    <!-- Subnet Container -->
    <rect width="660" height="535" rx="12" fill="url(#clusterGrad)" stroke="#059669" stroke-width="2"/>
    <rect x="0" y="0" width="660" height="34" rx="12" fill="#064e3b" opacity="0.9"/>
    
    <text x="20" y="22" fill="#a7f3d0" font-size="13" font-weight="bold" letter-spacing="0.5">SUBNET 11.0.0.0/24 — HIGH AVAILABILITY vSPHERE CLUSTER</text>
    <rect x="520" y="6" width="125" height="22" rx="4" fill="#022c22" stroke="#34d399" stroke-width="1"/>
    <text x="582" y="21" fill="#34d399" font-size="11" font-family="monospace" font-weight="bold" text-anchor="middle">Gateway: 11.0.0.15</text>
    
    <!-- Cluster Features Pill Banner -->
    <g transform="translate(20, 44)">
      <rect width="620" height="30" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="310" y="20" fill="#6ee7b7" font-size="11" font-weight="600" text-anchor="middle">
        ⚡ vSphere HA  •  🔄 DRS Auto-Balancing  •  🛡️ Fault Tolerance (FT)  •  🚀 vMotion  •  🗄️ NAS Shared Storage
      </text>
    </g>

    <!-- HOST 1 (11.0.0.3) -->
    <g transform="translate(20, 85)">
      <rect width="620" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="620" height="26" rx="8" fill="#0f172a" opacity="0.7"/>
      
      <circle cx="20" cy="13" r="5" fill="#34d399"/>
      <text x="35" y="17" fill="#f8fafc" font-size="12" font-weight="bold">ESXi Host 1</text>
      <text x="115" y="17" fill="#38bdf8" font-size="11" font-family="monospace">(IP: 11.0.0.3)</text>
      <text x="500" y="17" fill="#94a3b8" font-size="10">Cluster Compute Node 1</text>
      
      <!-- VM 1: vCenter -->
      <g transform="translate(15, 36)">
        <rect width="285" height="85" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
        <text x="12" y="20" fill="#38bdf8" font-size="12" font-weight="bold">⚙️ VMware vCenter Server (VCSA)</text>
        <text x="12" y="38" fill="#94a3b8" font-size="11">• Central Management Plane for All Hosts</text>
        <text x="12" y="54" fill="#94a3b8" font-size="11">• Controls Cluster DRS &amp; High Availability</text>
        <text x="12" y="70" fill="#94a3b8" font-size="11">• Distributed Virtual Networking &amp; FT</text>
      </g>
      
      <!-- VM 2: DC & NAS -->
      <g transform="translate(315, 36)">
        <rect width="290" height="85" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
        <text x="12" y="20" fill="#34d399" font-size="12" font-weight="bold">🗄️ Win Server 2019 (DC &amp; NAS Storage)</text>
        <text x="12" y="38" fill="#cbd5e1" font-size="10"><b>Active Directory:</b> HR, IT, Support, Finance, PMO</text>
        <text x="12" y="54" fill="#94a3b8" font-size="10">• DNS Forward/Reverse &amp; DHCP Scope Server</text>
        <text x="12" y="70" fill="#f59e0b" font-size="10"><b>NAS Shared Storage:</b> Enables Compute vMotion</text>
      </g>
    </g>

    <!-- HOST 2 (11.0.0.5) -->
    <g transform="translate(20, 230)">
      <rect width="620" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="620" height="26" rx="8" fill="#0f172a" opacity="0.7"/>
      
      <circle cx="20" cy="13" r="5" fill="#34d399"/>
      <text x="35" y="17" fill="#f8fafc" font-size="12" font-weight="bold">ESXi Host 2</text>
      <text x="115" y="17" fill="#38bdf8" font-size="11" font-family="monospace">(IP: 11.0.0.5)</text>
      <text x="500" y="17" fill="#94a3b8" font-size="10">Cluster Compute Node 2</text>
      
      <!-- VM 1: Veeam Backup -->
      <g transform="translate(15, 36)">
        <rect width="285" height="85" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1"/>
        <text x="12" y="20" fill="#34d399" font-size="12" font-weight="bold">💾 Veeam Backup &amp; Replication</text>
        <text x="12" y="38" fill="#94a3b8" font-size="11">• Central Orchestration &amp; Backup Console</text>
        <text x="12" y="54" fill="#94a3b8" font-size="11">• Jobs: VCenter, DC, SQL-Server, Win10</text>
        <text x="12" y="70" fill="#94a3b8" font-size="11">• Snapshot Management &amp; Instant Recovery</text>
      </g>
      
      <!-- VM 2: Win 10 Client -->
      <g transform="translate(315, 36)">
        <rect width="290" height="85" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
        <text x="12" y="20" fill="#818cf8" font-size="12" font-weight="bold">💻 Windows 10 Enterprise Client</text>
        <text x="12" y="38" fill="#94a3b8" font-size="11">• Domain-Joined Test Workstation</text>
        <text x="12" y="54" fill="#94a3b8" font-size="11">• Testing Department GPOs &amp; Permissions</text>
        <text x="12" y="70" fill="#94a3b8" font-size="11">• Validating Share Access &amp; Network Policies</text>
      </g>
    </g>

    <!-- HOST 3 (11.0.0.8) -->
    <g transform="translate(20, 375)">
      <rect width="620" height="95" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="620" height="26" rx="8" fill="#0f172a" opacity="0.7"/>
      
      <circle cx="20" cy="13" r="5" fill="#34d399"/>
      <text x="35" y="17" fill="#f8fafc" font-size="12" font-weight="bold">ESXi Host 3</text>
      <text x="115" y="17" fill="#38bdf8" font-size="11" font-family="monospace">(IP: 11.0.0.8)</text>
      <text x="500" y="17" fill="#94a3b8" font-size="10">Cluster Gateway Node</text>
      
      <!-- VM: Sophos Host VM -->
      <g transform="translate(15, 34)">
        <rect width="590" height="48" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
        <text x="15" y="20" fill="#a5b4fc" font-size="12" font-weight="bold">🛡️ Hosts Sophos XG Firewall Virtual Appliance</text>
        <text x="15" y="36" fill="#94a3b8" font-size="10">Multi-homed hypervisor networking: Bridged vSwitches linking WAN (NAT), Subnet 11, and Subnet 12</text>
      </g>
    </g>

    <!-- Shared Storage & vMotion Visual Bus -->
    <g transform="translate(20, 480)">
      <rect width="620" height="42" rx="6" fill="#091e17" stroke="#059669" stroke-dasharray="4,3" stroke-width="1.5"/>
      <text x="310" y="20" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">
        🔗 Dedicated Cluster Interconnect Bus (vMotion Network + Windows Server 2019 NAS Shared Datastores)
      </text>
      <text x="310" y="34" fill="#94a3b8" font-size="9" text-anchor="middle">
        Enables Compute-Only Live vMotion Migration Without Moving Virtual Disks
      </text>
    </g>
  </g>

  <!-- ==================== 4. SUBNET 12.0.0.0/24 (DISTRIBUTED SERVICES) ==================== -->
  <g transform="translate(720, 335)">
    <!-- Subnet Container -->
    <rect width="340" height="535" rx="12" fill="url(#distGrad)" stroke="#7c3aed" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="34" rx="12" fill="#4c1d95" opacity="0.9"/>
    
    <text x="15" y="22" fill="#ddd6fe" font-size="12" font-weight="bold">SUBNET 12.0.0.0/24 — DISTRIBUTED SERVICES</text>
    <rect x="235" y="6" width="95" height="22" rx="4" fill="#2e1065" stroke="#a78bfa" stroke-width="1"/>
    <text x="282" y="21" fill="#a78bfa" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">GW: 12.0.0.2</text>
    
    <!-- Role Banner -->
    <g transform="translate(15, 44)">
      <rect width="310" height="30" rx="6" fill="#0f172a" stroke="#7c3aed" stroke-width="1"/>
      <text x="155" y="20" fill="#c4b5fd" font-size="11" font-weight="600" text-anchor="middle">
        🌐 Off-Cluster Standalone Routed ESXi Host
      </text>
    </g>

    <!-- HOST 4 (12.0.0.12) -->
    <g transform="translate(15, 85)">
      <rect width="310" height="435" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <rect x="0" y="0" width="310" height="26" rx="8" fill="#0f172a" opacity="0.7"/>
      
      <circle cx="20" cy="13" r="5" fill="#a78bfa"/>
      <text x="35" y="17" fill="#f8fafc" font-size="12" font-weight="bold">ESXi Host 4</text>
      <text x="115" y="17" fill="#38bdf8" font-size="11" font-family="monospace">(IP: 12.0.0.12)</text>

      <!-- VM: Backup Proxy -->
      <g transform="translate(12, 36)">
        <rect width="286" height="110" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
        <text x="12" y="22" fill="#c4b5fd" font-size="12" font-weight="bold">⚡ Dedicated Veeam Backup Proxy</text>
        <text x="12" y="44" fill="#cbd5e1" font-size="10"><b>Role: Workload Offloading</b></text>
        <text x="12" y="60" fill="#94a3b8" font-size="10">• Reduces CPU/RAM stress on primary</text>
        <text x="12" y="74" fill="#94a3b8" font-size="10">  Veeam backup server in Subnet 11.</text>
        <text x="12" y="92" fill="#34d399" font-size="10">• Processes data compression &amp; deduplication.</text>
      </g>

      <!-- VM: Backup Repository Target -->
      <g transform="translate(12, 156)">
        <rect width="286" height="110" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
        <text x="12" y="22" fill="#fbbf24" font-size="12" font-weight="bold">🗄️ Isolated Backup Repository</text>
        <text x="12" y="44" fill="#cbd5e1" font-size="10"><b>Role: Disaster Recovery Storage</b></text>
        <text x="12" y="60" fill="#94a3b8" font-size="10">• Physically &amp; logically isolated storage pool</text>
        <text x="12" y="74" fill="#94a3b8" font-size="10">  across routed subnet boundary.</text>
        <text x="12" y="92" fill="#94a3b8" font-size="10">• Immune to single-subnet network failures.</text>
      </g>

      <!-- Architecture Highlight Box -->
      <g transform="translate(12, 276)">
        <rect width="286" height="145" rx="6" fill="#140f2b" stroke="#7c3aed" stroke-dasharray="3,3" stroke-width="1"/>
        <text x="12" y="20" fill="#ddd6fe" font-size="11" font-weight="bold">🎯 Strategic Architecture Value:</text>
        <text x="12" y="40" fill="#a78bfa" font-size="10"><b>1. Load Balancing:</b></text>
        <text x="12" y="56" fill="#94a3b8" font-size="10">Distributes heavy backup data streams.</text>
        <text x="12" y="78" fill="#a78bfa" font-size="10"><b>2. Network Segmentation:</b></text>
        <text x="12" y="94" fill="#94a3b8" font-size="10">Demonstrates cross-subnet routing via</text>
        <text x="12" y="108" fill="#94a3b8" font-size="10">Sophos Firewall without broadcast noise.</text>
        <text x="12" y="130" fill="#34d399" font-size="10"><b>Status:</b> Fully Operational &amp; Tested</text>
      </g>
    </g>
  </g>
</svg>
